name: Database tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Build administration app
        run: npm run build --workspace @glutenfree/admin

      - name: Bundle Android app
        run: npm exec --workspace @glutenfree/mobile -- expo export --platform android

      - name: Start local Supabase
        run: >-
          npm exec -- supabase start
          --exclude realtime,storage-api,imgproxy,kong,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit

      - name: Run database tests
        run: npm run db:test

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
